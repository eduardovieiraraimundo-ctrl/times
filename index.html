<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tela de Login</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-image: url('adote.jpg');
    padding: 0;
  height: 100vh;
    background-size: cover;
    background-position: center;
   
}

.login {
    background-color: rgba(0, 0, 0, 0.7);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 50px;
    border-radius: 30px;
}

input{
    
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: none;
    border-radius: 5px;
outline: none;
}

</style>


</head>
<body>

    <div class="login">
           <h1 style="color: aliceblue;">LOGIN</h1>
    <input type="text" placeholder="Usuário" id="login" >
    <br> <br>
    <input type="password" placeholder="Senha" id="senha">
    <br> <br>
  <input class="botao" type="submit"  onclick="login()" return false;> 
</div>      
 
<script>
function login() {
var login = document.getElementById("login").value;
var senha = document.getElementById("senha").value;

if (login === "edu" && senha === "2010") {
    alert("Login bem-sucedido!");
    location.href = "animais.html"; 
} else {
    alert("Usuário ou senha incorretos.");
        }
}
</script>


</body>
    </html>
